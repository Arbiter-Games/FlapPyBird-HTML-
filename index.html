<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages PyScript App</title>
    <!-- Load PyScript Core for running Python in the browser -->
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>
    <div class="container">
        <h1>Python Output</h1>
        <div class="status">PyScript Active</div>
        
        <!-- This tag automatically fetches and executes your main.py file -->
        <script type="py" src="main.py"></script>
    </div>
</body>
</html>
